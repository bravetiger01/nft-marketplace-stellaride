<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- Navbar -->
  <rect width="1200" height="64" fill="#000000" opacity="0.8"/>
  <rect y="63" width="1200" height="1" fill="#27272a"/>
  <!-- Logo -->
  <rect x="24" y="16" width="32" height="32" rx="8" fill="url(#btn)"/>
  <text x="40" y="39" fill="white" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">N</text>
  <text x="68" y="39" fill="white" font-family="Arial" font-size="18" font-weight="bold">NFT Marketplace</text>
  <!-- Balance pill -->
  <rect x="840" y="14" width="200" height="36" rx="18" fill="#27272a"/>
  <text x="860" y="27" fill="#71717a" font-family="Arial" font-size="11">Balance:</text>
  <text x="905" y="37" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">1,000,000.00 tokens</text>
  <!-- Address pill -->
  <rect x="1052" y="14" width="120" height="36" rx="18" fill="#27272a"/>
  <text x="1068" y="37" fill="#d4d4d8" font-family="monospace" font-size="13">GBE267...DVDQ3</text>
  <!-- Green dot -->
  <circle cx="1188" y="32" r="4" fill="#4ade80"/>
  <!-- Caption -->
  <text x="600" y="140" fill="#a1a1aa" font-family="Arial" font-size="16" text-anchor="middle" font-weight="500">Wallet Connected State</text>
  <text x="600" y="170" fill="#52525b" font-family="Arial" font-size="13" text-anchor="middle">Navbar shows connected wallet address with truncated public key and green connection indicator</text>
  <!-- Mockup arrow -->
  <line x1="600" y1="200" x2="600" y2="240" stroke="#52525b" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="600" y="280" fill="#71717a" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Replace with actual browser screenshot</text>
  <text x="600" y="310" fill="#3f3f46" font-family="Arial" font-size="12" text-anchor="middle">npm run dev → http://localhost:3000 → Connect Freighter → Capture</text>
</svg>
